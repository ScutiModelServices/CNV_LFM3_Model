# LFM3 service: N API replicas behind one nginx address. Each replica runs the model in its own process,
# so RAM use is per replica; the downloaded weights are shared through the models volume.
# Start:  docker compose up -d --build          (callers use http://<host>:9170)
# Scale:  LFM3_REPLICAS=3 docker compose up -d --build, then: docker compose restart lfm3_lb

name: lfm3

services:
  lfm3:
    build: .
    restart: unless-stopped
    mem_limit: ${LFM3_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    environment:
      LFM3_ADMIN_PASSWORD: ${LFM3_ADMIN_PASSWORD:-}
      LFM3_NUM_THREAD: ${LFM3_NUM_THREAD:-}
      LFM3_REPLICAS: ${LFM3_REPLICAS:-1}  # shown read-only on /admin/
      LFM3_OLLAMA_URL: ${LFM3_OLLAMA_URL:-}  # set = answer through this Ollama (GGUF) instead of torch
      LFM3_OLLAMA_MODEL: ${LFM3_OLLAMA_MODEL:-}
      LFM3_THINKING: ${LFM3_THINKING:-}  # off (default) or on, Ollama backend
      LFM3_HIDE_REASONING: ${LFM3_HIDE_REASONING:-}  # empty = on
    extra_hosts: ["host.docker.internal:host-gateway"]  # reaches an Ollama running on the host
    volumes:
      - models:/models
      - tokens:/data
    deploy:
      replicas: ${LFM3_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9170/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [lfm3]

  lfm3_lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${LFM3_PORT:-9170}:9170"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      lfm3:
        condition: service_healthy
    networks: [lfm3]

volumes:
  models:
  tokens:

networks:
  # Other stacks reach http://lfm3_lb:9170 by joining this network.
  lfm3:
