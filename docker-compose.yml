# LFM3 service: N API replicas behind one nginx address. Each replica runs the model in its own process,
# so RAM use is per replica; the downloaded weights are shared through the models volume.
# Start:  docker compose up -d --build          (callers use http://<host>:29202)
# Scale:  SERVICE_REPLICAS=3 docker compose up -d --build, then: docker compose restart cnv_lfm3_model_lb

name: cnv_lfm3_model

services:
  cnv_lfm3_model:
    build: .
    image: cnv_lfm3_model:latest
    restart: unless-stopped
    mem_limit: ${SERVICE_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    environment:
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-}
      SERVICE_NUM_THREAD: ${SERVICE_NUM_THREAD:-}
      SERVICE_REPLICAS: ${SERVICE_REPLICAS:-1}  # shown read-only on /admin/
      SERVICE_OLLAMA_URL: ${SERVICE_OLLAMA_URL:-}  # set = answer through this Ollama (GGUF) instead of torch
      SERVICE_OLLAMA_MODEL: ${SERVICE_OLLAMA_MODEL:-}
      SERVICE_THINKING: ${SERVICE_THINKING:-}  # off (default) or on, Ollama backend
      SERVICE_HIDE_REASONING: ${SERVICE_HIDE_REASONING:-}  # empty = on
    extra_hosts: ["host.docker.internal:host-gateway"]  # reaches an Ollama running on the host
    volumes:
      - cnv_lfm3_model_models:/models
      - cnv_lfm3_model_data:/data
    deploy:
      replicas: ${SERVICE_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29202/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [cnv_lfm3_model]

  cnv_lfm3_model_lb:
    container_name: cnv_lfm3_model_lb
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-29202}:29202"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cnv_lfm3_model:
        condition: service_healthy
    networks:
      cnv_lfm3_model:
      citadel:
        aliases: [cnv_lfm3_model_lb]

volumes:
  cnv_lfm3_model_models:
    name: cnv_lfm3_model_models
  cnv_lfm3_model_data:
    name: cnv_lfm3_model_data
networks:
  # Other stacks reach http://cnv_lfm3_model_lb:29202 by joining this network.
  cnv_lfm3_model:
    name: cnv_lfm3_model
  citadel:
    name: citadel_core
    external: true
